<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar SSO</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-brand-500: oklch(0.65 0.2 250);
      --color-brand-600: oklch(0.55 0.22 250);
      --color-brand-700: oklch(0.45 0.22 250);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200">
  <div id="app"></div>

  <script type="module">
    import { authService } from './assets/js/services/authService.js';
    import { mountRegisterForm } from './assets/js/ui/registerForm.js';

    if (authService.getSession()) {
      location.href = '/dashboard.html';
    } else {
      mountRegisterForm(document.getElementById('app'));
    }
  </script>
</body>
</html>
